services:
  - type: web
    name: cylinder-flyway-mcp-phase1
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      - key: PLATFORM
        value: RENDER

      - key: MIGRATION_DIR
        value: /app/migrations

      - key: DATABASE_WRITES
        value: "1"

      - key: DB_WRITE_PARALLELISM
        value: "1"

      - key: MIGRATION_BATCH_SIZE
        value: "1"

      - key: TESTCONTAINERS_POSTGRES_IMAGE
        value: postgres:17.6

      - key: TC_CLOUD_CONCURRENCY
        value: "1"

      # Phase-1 API authentication secret.
      - key: MCP_AUTH_TOKEN
        sync: false

      # Testcontainers Cloud service-account token.
      - key: TC_CLOUD_TOKEN
        sync: false
